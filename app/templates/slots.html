<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Manager — AI Newsroom Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            color: #1e293b;
        }

        /* ── Topbar ───────────────────────────────────── */
        .topbar {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 28px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 30;
        }

        .topbar-title {
            font-size: 0.9375rem;
            font-weight: 700;
            color: #0f172a;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-v {
            padding: 3px 11px;
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        /* ── Buttons ───────────────────────────────────── */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-primary svg {
            width: 14px;
            height: 14px;
        }

        /* ── Content ───────────────────────────────────── */
        .content-area {
            padding: 28px;
            flex: 1;
            overflow: scroll;
        }

        .page-sub {
            font-size: 0.8125rem;
            color: #64748b;
            margin-bottom: 22px;
        }

        /* ── Slots grid ────────────────────────────────── */
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
            gap: 14px;
        }

        .slot-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: box-shadow 0.15s, border-color 0.15s;
        }

        .slot-card:hover {
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
            border-color: #cbd5e1;
        }

        .slot-head {
            padding: 16px 18px 12px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .slot-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: #0f172a;
        }

        .slot-desc {
            font-size: 0.72rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .badge-active {
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            background: #dcfce7;
            color: #16a34a;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .badge-inactive {
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            background: #f1f5f9;
            color: #94a3b8;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .slot-body {
            padding: 14px 18px;
        }

        .slot-stats {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-val-cols {
            font-size: 1.65rem;
            font-weight: 800;
            color: #2563eb;
            line-height: 1;
        }

        .stat-val-slots {
            font-size: 1.65rem;
            font-weight: 800;
            color: #7c3aed;
            line-height: 1;
        }

        .stat-lbl {
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 2px;
        }

        .stat-div {
            width: 1px;
            height: 28px;
            background: #e2e8f0;
        }

        /* grid preview */
        .gp {
            display: grid;
            gap: 2px;
            flex: 1;
        }

        .gp-cell {
            height: 9px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 2px;
        }

        .slot-foot {
            padding: 10px 18px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            gap: 7px;
        }

        .btn-e {
            flex: 1;
            padding: 7px;
            background: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
            font-size: .76rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all .15s;
        }

        .btn-e:hover {
            background: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }

        .btn-e i {
            color: #f59e0b;
            margin-right: 4px;
        }

        .btn-d {
            flex: 1;
            padding: 7px;
            background: #fff5f5;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 7px;
            font-size: .76rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all .15s;
        }

        .btn-d:hover {
            background: #fef2f2;
            border-color: #f87171;
        }

        .btn-d i {
            color: #dc2626;
            margin-right: 4px;
        }

        /* ── Modals ────────────────────────────────────── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .overlay.hidden {
            display: none;
        }

        .modal {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 28px;
            width: 440px;
            max-width: 95vw;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .12);
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
        }

        .fld {
            margin-bottom: 14px;
        }

        .fld label {
            display: block;
            font-size: .72rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }

        .frow {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .finput,
        .fselect {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
            padding: 9px 12px;
            font-size: .875rem;
            color: #0f172a;
            outline: none;
            font-family: 'Inter', sans-serif;
            appearance: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .finput:focus,
        .fselect:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
            background: #fff;
        }

        .finput::placeholder {
            color: #94a3b8;
        }

        .cb-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cb-row input {
            width: 15px;
            height: 15px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .cb-row label {
            font-size: .875rem;
            color: #334155;
            cursor: pointer;
        }

        .modal-btns {
            display: flex;
            gap: 9px;
            margin-top: 24px;
        }

        .modal-btns .btn-primary {
            flex: 1;
            justify-content: center;
        }

        .btn-cancel {
            flex: 1;
            padding: 9px;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: .875rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .btn-cancel:hover {
            background: #e2e8f0;
        }

        /* ── Toast ─────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 22px;
            right: 22px;
            padding: 11px 16px;
            border-radius: 9px;
            font-size: .8125rem;
            font-weight: 600;
            z-index: 200;
            transform: translateY(10px);
            opacity: 0;
            transition: all .22s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
            font-family: 'Inter', sans-serif;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: #16a34a;
            color: #fff;
        }

        .toast.error {
            background: #dc2626;
            color: #fff;
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(4px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .anim {
            animation: in .18s ease-out;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    {% include 'sidebar.html' %}

    <div class="sb-offset">

        <!-- Topbar -->
        <header class="topbar">
            <span class="topbar-title">Slot Manager</span>
            <div class="topbar-right">
                <button class="btn-primary" onclick="showCreate()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                    </svg>
                    New Slot
                </button>
            </div>
        </header>

        <!-- Content -->
        <div class="content-area">
            <p class="page-sub">Define newspaper layout presets — column span &amp; slot count combinations</p>
            <div id="slotGrid" class="slots-grid">
                <div style="padding:48px;text-align:center;color:#94a3b8;grid-column:1/-1">Loading…</div>
            </div>
        </div>
    </div>

    <!-- Create Modal -->
    <div id="mdlCreate" class="overlay hidden" onclick="if(event.target===this)hideCreate()">
        <div class="modal">
            <p class="modal-title">Create New Slot</p>
            <div class="fld"><label>Slot Name *</label><input id="cName" type="text" class="finput"
                    placeholder="e.g. Lead Story"></div>
            <div class="fld frow">
                <div>
                    <label>Columns (1–8)</label>
                    <select id="cCols" class="fselect">
                        <option value="1" selected>1 Column</option>
                        <option value="2">2 Columns</option>
                        <option value="3">3 Columns</option>
                        <option value="4">4 Columns</option>
                        <option value="5">5 Columns</option>
                        <option value="6">6 Columns</option>
                        <option value="7">7 Columns</option>
                        <option value="8">8 Columns</option>
                    </select>
                </div>
                <div>
                    <label>Slots (1–4)</label>
                    <select id="cSlots" class="fselect">
                        <option value="1" selected>1 Slot</option>
                        <option value="2">2 Slots</option>
                        <option value="3">3 Slots</option>
                        <option value="4">4 Slots</option>
                    </select>
                </div>
            </div>
            <div class="fld"><label>Description</label><input id="cDesc" type="text" class="finput"
                    placeholder="Brief layout description"></div>

            <div class="frow" style="margin-bottom: 14px;">
                <div>
                    <label>Headline Words</label>
                    <input id="cWcH" type="number" class="finput" value="10">
                </div>
                <div>
                    <label>Intro Words</label>
                    <input id="cWcI" type="number" class="finput" value="70">
                </div>
            </div>
            <div class="fld">
                <label>Content Words</label>
                <input id="cWcB" type="number" class="finput" value="170">
            </div>

            <div class="fld">
                <div class="cb-row"><input type="checkbox" id="cActive" checked><label for="cActive">Active</label>
                </div>
            </div>
            <div class="modal-btns">
                <button class="btn-primary" onclick="createSlot()">Create Slot</button>
                <button class="btn-cancel" onclick="hideCreate()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="mdlEdit" class="overlay hidden" onclick="if(event.target===this)hideEdit()">
        <div class="modal">
            <p class="modal-title">Edit Slot</p>
            <input type="hidden" id="eId">
            <div class="fld"><label>Slot Name</label><input id="eName" type="text" class="finput"></div>
            <div class="fld frow">
                <div>
                    <label>Columns</label>
                    <select id="eCols" class="fselect">
                        <option value="1">1 Column</option>
                        <option value="2">2 Columns</option>
                        <option value="3">3 Columns</option>
                        <option value="4">4 Columns</option>
                        <option value="5">5 Columns</option>
                        <option value="6">6 Columns</option>
                        <option value="7">7 Columns</option>
                        <option value="8">8 Columns</option>
                    </select>
                </div>
                <div>
                    <label>Slots</label>
                    <select id="eSlots" class="fselect">
                        <option value="1">1 Slot</option>
                        <option value="2">2 Slots</option>
                        <option value="3">3 Slots</option>
                        <option value="4">4 Slots</option>
                    </select>
                </div>
            </div>
            <div class="fld"><label>Description</label><input id="eDesc" type="text" class="finput"></div>

            <div class="frow" style="margin-bottom: 14px;">
                <div>
                    <label>Headline Words</label>
                    <input id="eWcH" type="number" class="finput">
                </div>
                <div>
                    <label>Intro Words</label>
                    <input id="eWcI" type="number" class="finput">
                </div>
            </div>
            <div class="fld">
                <label>Content Words</label>
                <input id="eWcB" type="number" class="finput">
            </div>

            <div class="fld">
                <div class="cb-row"><input type="checkbox" id="eActive"><label for="eActive">Active</label></div>
            </div>
            <div class="modal-btns">
                <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
                <button class="btn-cancel" onclick="hideEdit()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let slots = [];

        async function api(m, p, b) {
            const r = await fetch('/api/slots' + p, {
                method: m, headers: { 'Content-Type': 'application/json' },
                body: b ? JSON.stringify(b) : undefined
            });
            if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || 'HTTP ' + r.status); }
            return r.json();
        }

        function toast(msg, t = 'success') {
            const el = document.getElementById('toast');
            el.textContent = msg; el.className = 'toast ' + t + ' show';
            setTimeout(() => el.classList.remove('show'), 2800);
        }

        function gp(cols, slotCount) {
            let c = '';
            for (let s = 0; s < slotCount; s++) for (let i = 0; i < cols; i++) c += '<div class="gp-cell"></div>';
            return `<div class="gp" style="grid-template-columns:repeat(${cols},1fr)">${c}</div>`;
        }

        async function load() {
            try { slots = await api('GET', '/'); render(); }
            catch (e) { toast(e.message, 'error'); }
        }

        function render() {
            const g = document.getElementById('slotGrid');
            if (!slots.length) { g.innerHTML = '<div style="padding:60px;text-align:center;color:#94a3b8;grid-column:1/-1">No slots yet. Create one!</div>'; return; }
            g.innerHTML = slots.map(s => `
            <div class="slot-card anim">
                <div class="slot-head">
                    <div>
                        <div class="slot-name">${s.name}</div>
                        <div class="slot-desc">${s.description || 'No description'}</div>
                    </div>
                    <span class="${s.is_active ? 'badge-active' : 'badge-inactive'}">${s.is_active ? 'Active' : 'Inactive'}</span>
                </div>
                <div class="slot-body">
                    <div class="slot-stats">
                        <div class="stat-item">
                            <div class="stat-val-cols">${s.column_span}</div>
                            <div class="stat-lbl">Columns</div>
                        </div>
                        <div class="stat-div"></div>
                        <div class="stat-item">
                            <div class="stat-val-slots">${s.slot_count}</div>
                            <div class="stat-lbl">Slot${s.slot_count > 1 ? 's' : ''}</div>
                        </div>
                   </div>
                   <div class="flex items-center gap-3 mt-3 pt-3 border-t border-gray-50 text-[10px] text-gray-400 font-bold uppercase tracking-wider">
                        <span>H: ${s.wc_headline || 10}w</span>
                        <span>I: ${s.wc_intro || 70}w</span>
                        <span>C: ${s.wc_body || 170}w</span>
                   </div>
                </div>
                <div class="slot-body" style="padding-top:0">
                    <div class="slot-stats" style="margin-top: 10px;">
                        ${gp(s.column_span, s.slot_count)}
                    </div>
                </div>
                <div class="slot-foot">
                    <button class="btn-e" onclick="openEdit('${s.id}')"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                    <button class="btn-d" onclick="delSlot('${s.id}','${s.name}')"><i class="fa-solid fa-trash-can"></i> Delete</button>
                </div>
            </div>`).join('');
        }

        function showCreate() { document.getElementById('mdlCreate').classList.remove('hidden'); }
        function hideCreate() { document.getElementById('mdlCreate').classList.add('hidden'); }

        async function createSlot() {
            const name = document.getElementById('cName').value.trim();
            const column_span = +document.getElementById('cCols').value;
            const slot_count = +document.getElementById('cSlots').value;
            const description = document.getElementById('cDesc').value.trim();
            const wc_headline = +document.getElementById('cWcH').value;
            const wc_intro = +document.getElementById('cWcI').value;
            const wc_body = +document.getElementById('cWcB').value;
            const is_active = document.getElementById('cActive').checked;

            if (!name) { toast('Name required', 'error'); return; }
            try {
                await api('POST', '/', {
                    name, column_span, slot_count, description,
                    is_active, wc_headline, wc_intro, wc_body
                });
                toast('"' + name + '" created!');
                hideCreate();
                document.getElementById('cName').value = '';
                document.getElementById('cDesc').value = '';
                await load();
            }
            catch (e) { toast(e.message, 'error'); }
        }

        function openEdit(id) {
            const s = slots.find(x => x.id === id); if (!s) return;
            document.getElementById('eId').value = s.id;
            document.getElementById('eName').value = s.name;
            document.getElementById('eCols').value = s.column_span;
            document.getElementById('eSlots').value = s.slot_count;
            document.getElementById('eDesc').value = s.description || '';
            document.getElementById('eWcH').value = s.wc_headline || 10;
            document.getElementById('eWcI').value = s.wc_intro || 70;
            document.getElementById('eWcB').value = s.wc_body || 170;
            document.getElementById('eActive').checked = s.is_active;
            document.getElementById('mdlEdit').classList.remove('hidden');
        }
        function hideEdit() { document.getElementById('mdlEdit').classList.add('hidden'); }

        async function saveEdit() {
            const id = document.getElementById('eId').value;
            const name = document.getElementById('eName').value.trim();
            const column_span = +document.getElementById('eCols').value;
            const slot_count = +document.getElementById('eSlots').value;
            const description = document.getElementById('eDesc').value.trim();
            const wc_headline = +document.getElementById('eWcH').value;
            const wc_intro = +document.getElementById('eWcI').value;
            const wc_body = +document.getElementById('eWcB').value;
            const is_active = document.getElementById('eActive').checked;

            try {
                await api('PUT', '/' + id, {
                    name, column_span, slot_count, description,
                    is_active, wc_headline, wc_intro, wc_body
                });
                toast('Updated!');
                hideEdit();
                await load();
            }
            catch (e) { toast(e.message, 'error'); }
        }

        async function delSlot(id, name) {
            if (!confirm('Delete "' + name + '"?')) return;
            try { await api('DELETE', '/' + id); toast('Deleted "' + name + '"'); await load(); }
            catch (e) { toast(e.message, 'error'); }
        }

        load();
    </script>
</body>

</html>
