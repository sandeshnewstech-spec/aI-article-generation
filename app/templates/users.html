<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | AI Newsroom Pro</title>
    <script src="/static/tailwind.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .loader {
            border: 3px solid rgba(229, 231, 235, 0.5);
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .sb-offset {
            margin-left: 240px;
            width: stretch;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        html,
        body {
            overflow: hidden !important;
            height: 100vh !important;
            width: 100vw !important;
            margin: 0;
            padding: 0;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }
    </style>
</head>

<body class="bg-gray-50 h-full overflow-hidden text-gray-800 font-sans">

    {% include 'sidebar.html' %}

    <div class="sb-offset flex flex-col h-screen max-h-screen overflow-hidden">
        <!-- Header -->
        <nav class="bg-white border-b border-gray-200 shadow-sm z-30">
            <div class="mx-auto px-6">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3">
                        <div class="bg-blue-600 p-2 rounded-lg text-white shadow-lg shadow-blue-600/20">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-xl font-bold text-gray-900 tracking-tight">User Management</h1>
                            <p class="text-xs text-gray-500 font-medium uppercase tracking-widest">System Administration
                            </p>
                        </div>
                    </div>

                    <button onclick="openModal()"
                        class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-semibold transition-all shadow-lg shadow-blue-600/20 active:scale-95">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                        Add New User
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="flex-1 w-full mx-auto px-6 py-8 overflow-y-auto custom-scrollbar">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50/50">
                    <div>
                        <h2 class="text-lg font-bold text-gray-900">System Users</h2>
                        <p class="text-sm text-gray-500">Manage your team members and their roles</p>
                    </div>
                    <span id="userCount" class="px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-xs font-bold">0
                        Users</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead
                            class="text-xs font-bold text-gray-400 uppercase tracking-wider border-b border-gray-100 bg-gray-50/30">
                            <tr>
                                <th class="px-6 py-4">User Details</th>
                                <th class="px-6 py-4">Role</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userList" class="divide-y divide-gray-100">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- User Modal -->
    <div id="userModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md">
            <div
                class="bg-white rounded-3xl shadow-2xl border border-gray-200 overflow-hidden transform transition-all">
                <div class="px-8 py-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <h3 id="modalTitle" class="text-xl font-bold text-gray-900">Add New User</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <form id="userForm" class="p-8 space-y-5">
                    <input type="hidden" id="edit_user_id">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </span>
                            <input type="text" id="username" required
                                class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-gray-900"
                                placeholder="Enter username">
                        </div>
                    </div>

                    <div id="passwordContainer">
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </span>
                            <input type="password" id="password"
                                class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-gray-900"
                                placeholder="Enter password">
                        </div>
                        <p id="passwordHint" class="text-xs text-gray-400 mt-1 hidden">Leave blank to keep current
                            password</p>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Role</label>
                        <select id="role"
                            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-gray-900">
                            <option value="user">User (Standard)</option>
                            <option value="super_admin">Super Admin</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="is_active" checked
                            class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                        <label for="is_active" class="text-sm font-semibold text-gray-700">Account Active</label>
                    </div>

                    <div class="pt-4 flex gap-3">
                        <button type="button" onclick="closeModal()"
                            class="flex-1 px-6 py-3 border border-gray-200 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition active:scale-95">
                            Cancel
                        </button>
                        <button type="submit" id="submitBtn"
                            class="flex-2 px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg shadow-blue-600/20 active:scale-95">
                            Save User
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        const currentRole = localStorage.getItem('user_role');
        if (!token || currentRole !== 'super_admin') {
            window.location.href = '/login';
        }

        let allUsers = [];

        async function fetchUsers() {
            try {
                const response = await fetch('/api/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.status === 401) window.location.href = '/login';
                allUsers = await response.json();
                renderUsers(allUsers);
            } catch (err) {
                console.error('Failed to fetch users', err);
            }
        }

        function renderUsers(users) {
            const list = document.getElementById('userList');
            document.getElementById('userCount').textContent = `${users.length} Users`;

            if (users.length === 0) {
                list.innerHTML = `
                    <tr>
                        <td colspan="4" class="px-6 py-12 text-center text-gray-500">
                            No users found. Click "Add New User" to create one.
                        </td>
                    </tr>
                `;
                return;
            }

            list.innerHTML = users.map(user => `
                <tr class="hover:bg-gray-50/80 transition-colors group">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-md">
                                ${user.username.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <span class="font-bold text-gray-900 block">${user.username}</span>
                                <span class="text-xs text-gray-400 font-medium">User ID: ${user.id.slice(-8)}</span>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold ${user.role === 'super_admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-50 text-blue-600'}">
                            ${user.role === 'super_admin' ? 'SUPER ADMIN' : 'USER'}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full ${user.is_active ? 'bg-green-500 animate-pulse' : 'bg-red-500'}"></div>
                            <span class="text-sm font-semibold ${user.is_active ? 'text-green-700' : 'text-red-700'}">${user.is_active ? 'Active' : 'Inactive'}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="openModal('${user.id}')" class="p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all" title="Edit User">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                </svg>
                            </button>
                            <button onclick="deleteUser('${user.id}')" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all" title="Delete User">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(userId = null) {
            const modal = document.getElementById('userModal');
            const title = document.getElementById('modalTitle');
            const form = document.getElementById('userForm');
            const idInput = document.getElementById('edit_user_id');
            const passwordHint = document.getElementById('passwordHint');
            const passwordInput = document.getElementById('password');

            form.reset();
            modal.classList.remove('hidden');

            if (userId) {
                const user = allUsers.find(u => u.id === userId);
                title.textContent = 'Edit User';
                idInput.value = user.id;
                document.getElementById('username').value = user.username;
                document.getElementById('role').value = user.role;
                document.getElementById('is_active').checked = user.is_active;
                passwordHint.classList.remove('hidden');
                passwordInput.required = false;
            } else {
                title.textContent = 'Add New User';
                idInput.value = '';
                passwordHint.classList.add('hidden');
                passwordInput.required = true;
            }
        }

        function closeModal() {
            document.getElementById('userModal').classList.add('hidden');
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit_user_id').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const is_active = document.getElementById('is_active').checked;

            const url = id ? `/api/users/${id}` : '/api/users';
            const method = id ? 'PUT' : 'POST';

            const payload = { username, role, is_active };
            if (password) payload.password = password;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    closeModal();
                    fetchUsers();
                } else {
                    const data = await response.json();
                    alert(data.detail || 'Failed to save user');
                }
            } catch (err) {
                alert('Error saving user');
            }
        });

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user? This action cannot be undone.')) return;

            try {
                const response = await fetch(`/api/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    fetchUsers();
                } else {
                    const data = await response.json();
                    alert(data.detail || 'Failed to delete user');
                }
            } catch (err) {
                alert('Error deleting user');
            }
        }

        fetchUsers();
    </script>
</body>

</html>
