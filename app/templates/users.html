<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandesh AI | Users</title>
    <link rel="icon" href="/static/favicon.jpeg" type="image/jpeg">
    <script src="/static/tailwind.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Design System ──────────────────────────────── */
        :root {
            --brand-primary: #ae0a0b;
            --brand-primary-dark: #800607;
            --brand-secondary: #0f172a;
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --radius-xl: 1rem;
            --radius-lg: 0.75rem;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .loader {
            border: 2px solid rgba(174, 10, 11, 0.1);
            border-top: 2px solid var(--brand-primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* ── Layout ────────────────────────────────────── */
        .sb-offset {
            margin-left: 210px;
            /* Matching sidebar width */
            width: calc(100% - 210px);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        html,
        body {
            overflow: hidden !important;
            height: 100vh !important;
            width: 100vw !important;
            margin: 0;
            padding: 0;
            background: var(--bg-main);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
            border: 2px solid var(--bg-main);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ── Components ────────────────────────────────── */
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .user-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .user-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: #cbd5e1;
        }

        .avatar-gradient {
            background: linear-gradient(135deg, #ae0a0b 0%, #ef4444 100%);
            box-shadow: 0 4px 12px rgba(174, 10, 11, 0.2);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-admin {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fee2e2;
        }

        .badge-user {
            background: #f0f9ff;
            color: #075985;
            border: 1px solid #e0f2fe;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-active {
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .status-inactive {
            background: var(--danger);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .btn-action {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            transition: all 0.2s;
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        .btn-edit:hover {
            background: #f0f9ff;
            color: #0284c7;
            border-color: #bae6fd;
        }

        .btn-delete:hover {
            background: #fef2f2;
            color: #dc2626;
            border-color: #fecaca;
        }

        /* ── Modal ─────────────────────────────────────── */
        .modal-overlay {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
        }

        .input-group {
            position: relative;
            transition: all 0.2s;
        }

        .input-group:focus-within {
            transform: translateY(-1px);
        }

        .input-premium {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.875rem;
            transition: all 0.2s;
            color: var(--brand-secondary);
        }

        .input-premium:focus {
            background: #fff;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(174, 10, 11, 0.05);
            outline: none;
        }

        /* ── Animations ────────────────────────────────── */
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-white h-full overflow-hidden text-gray-800 font-sans">

    {% include 'sidebar.html' %}

    <div class="sb-offset">
        <!-- Header -->
        <nav class="glass-nav sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-8">
                <div class="flex justify-between h-20 items-center">
                    <div class="flex items-center gap-5">
                        <div class="avatar-gradient p-3 rounded-2xl text-white shadow-lg">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-2xl font-black text-slate-900 tracking-tight">User Management</h1>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="flex h-2 w-2 rounded-full bg-emerald-500"></span>
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-[0.2em]">System
                                    Administration</p>
                            </div>
                        </div>
                    </div>

                    <button onclick="openModal()"
                        class="group flex items-center gap-3 bg-slate-900 hover:bg-black text-white px-6 py-3 rounded-xl font-bold transition-all shadow-xl hover:shadow-2xl hover:-translate-y-0.5 active:scale-95">
                        <div class="bg-white/20 rounded-lg p-1 group-hover:rotate-90 transition-transform duration-300">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                    d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                            </svg>
                        </div>
                        <span class="text-sm">Add New User</span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="flex-1 w-full max-w-7xl mx-auto px-8 py-10 overflow-y-auto custom-scrollbar">
            <div class="mb-8 flex items-end justify-between">
                <div>
                    <h2 class="text-lg font-bold text-slate-900">Active Staff</h2>
                    <p class="text-sm text-slate-500 mt-1">Directory of all users with system access</p>
                </div>
                <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Total Population</span>
                    <span id="userCount" class="text-lg font-black text-slate-900">0</span>
                </div>
            </div>

            <div id="userList" class="grid grid-cols-1 gap-4">
                <!-- Populated by JS -->
                <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                    <div class="loader mb-4"></div>
                    <p class="text-sm font-medium">Synchronizing user data...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- User Modal -->
    <div id="userModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md p-4">
            <div class="modal-content overflow-hidden transform transition-all">
                <div class="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <div>
                        <h3 id="modalTitle" class="text-xl font-black text-slate-900 tracking-tight">Add New User</h3>
                        <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mt-1">Configure system
                            access</p>
                    </div>
                    <button onclick="closeModal()"
                        class="w-10 h-10 flex items-center justify-center rounded-xl bg-white border border-slate-200 text-slate-400 hover:text-slate-600 transition-all shadow-sm active:scale-90">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <form id="userForm" class="p-8 space-y-6">
                    <input type="hidden" id="edit_user_id">

                    <div class="space-y-2">
                        <label
                            class="block text-[11px] font-black text-slate-500 uppercase tracking-widest ml-1">Username</label>
                        <div class="input-group">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </span>
                            <input type="text" id="username" required class="input-premium" placeholder="e.g. jsmith">
                        </div>
                    </div>

                    <div id="passwordContainer" class="space-y-2">
                        <label
                            class="block text-[11px] font-black text-slate-500 uppercase tracking-widest ml-1">Password</label>
                        <div class="input-group">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </span>
                            <input type="password" id="password" class="input-premium" placeholder="••••••••">
                        </div>
                        <p id="passwordHint" class="text-[10px] text-slate-400 font-bold italic mt-1.5 ml-1 hidden">
                            Leave blank to retain current password</p>
                    </div>

                    <div class="space-y-2">
                        <label
                            class="block text-[11px] font-black text-slate-500 uppercase tracking-widest ml-1">Assigned
                            Role</label>
                        <div class="relative">
                            <select id="role" class="input-premium appearance-none">
                                <option value="user">User (Standard)</option>
                                <option value="super_admin">Super Admin</option>
                            </select>
                            <div
                                class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                        d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <div class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="is_active" checked class="sr-only peer">
                            <div onclick="document.getElementById('is_active').click()"
                                class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-brand-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-primary">
                            </div>
                        </div>
                        <label for="is_active" class="text-sm font-bold text-slate-700 cursor-pointer">Account is
                            Active</label>
                    </div>

                    <div class="pt-4 flex gap-4">
                        <button type="button" onclick="closeModal()"
                            class="flex-1 px-6 py-3.5 border border-slate-200 text-slate-600 font-black text-xs uppercase tracking-widest rounded-xl hover:bg-slate-50 transition active:scale-95">
                            Cancel
                        </button>
                        <button type="submit" id="submitBtn"
                            class="flex-[2] px-8 py-3.5 bg-brand-primary hover:bg-brand-primary-dark text-white font-black text-xs uppercase tracking-widest rounded-xl transition shadow-xl shadow-brand-primary/20 active:scale-95">
                            Save User
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        const currentRole = localStorage.getItem('user_role');
        if (!token || currentRole !== 'super_admin') {
            window.location.href = '/login';
        }

        let allUsers = [];

        async function fetchUsers() {
            try {
                const response = await fetch('/api/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.status === 401) window.location.href = '/login';
                allUsers = await response.json();
                renderUsers(allUsers);
            } catch (err) {
                console.error('Failed to fetch users', err);
            }
        }

        function renderUsers(users) {
            const list = document.getElementById('userList');
            document.getElementById('userCount').textContent = users.length;

            if (users.length === 0) {
                list.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 bg-white rounded-3xl border border-dashed border-slate-300">
                        <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-4">
                            <svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                            </svg>
                        </div>
                        <p class="text-slate-500 font-bold tracking-tight">No staff members found</p>
                        <p class="text-xs text-slate-400 mt-1">Add your first user to begin collaboration</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = users.map((user, index) => `
                <div class="user-card px-6 py-5 flex items-center justify-between fade-in" style="animation-delay: ${index * 0.05}s">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 rounded-2xl avatar-gradient flex items-center justify-center text-white font-black text-xl">
                            ${user.username.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <h3 class="font-black text-slate-900 text-lg tracking-tight">${user.username}</h3>
                            <div class="flex items-center gap-3 mt-1">
                                <span class="badge ${user.role === 'super_admin' ? 'badge-admin' : 'badge-user'}">
                                    ${user.role === 'super_admin' ? 'Super Admin' : 'Staff'}
                                </span>
                                <div class="flex items-center gap-1.5 ml-1">
                                    <span class="status-dot ${user.is_active ? 'status-active' : 'status-inactive'}"></span>
                                    <span class="text-[10px] font-bold uppercase tracking-widest ${user.is_active ? 'text-emerald-600' : 'text-rose-600'}">
                                        ${user.is_active ? 'Active' : 'Offline'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="openModal('${user.id}')" class="btn-action btn-edit" title="Edit Profile">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                            </svg>
                        </button>
                        <div class="w-px h-6 bg-slate-100 mx-1"></div>
                        <button onclick="deleteUser('${user.id}')" class="btn-action btn-delete" title="Remove User">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openModal(userId = null) {
            const modal = document.getElementById('userModal');
            const title = document.getElementById('modalTitle');
            const form = document.getElementById('userForm');
            const idInput = document.getElementById('edit_user_id');
            const passwordHint = document.getElementById('passwordHint');
            const passwordInput = document.getElementById('password');

            form.reset();
            modal.classList.remove('hidden');

            if (userId) {
                const user = allUsers.find(u => u.id === userId);
                title.textContent = 'Edit User';
                idInput.value = user.id;
                document.getElementById('username').value = user.username;
                document.getElementById('role').value = user.role;
                document.getElementById('is_active').checked = user.is_active;
                passwordHint.classList.remove('hidden');
                passwordInput.required = false;
            } else {
                title.textContent = 'Add New User';
                idInput.value = '';
                passwordHint.classList.add('hidden');
                passwordInput.required = true;
            }
        }

        function closeModal() {
            document.getElementById('userModal').classList.add('hidden');
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit_user_id').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const is_active = document.getElementById('is_active').checked;

            const url = id ? `/api/users/${id}` : '/api/users';
            const method = id ? 'PUT' : 'POST';

            const payload = { username, role, is_active };
            if (password) payload.password = password;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    closeModal();
                    fetchUsers();
                } else {
                    const data = await response.json();
                    alert(data.detail || 'Failed to save user');
                }
            } catch (err) {
                alert('Error saving user');
            }
        });

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user? This action cannot be undone.')) return;

            try {
                const response = await fetch(`/api/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    fetchUsers();
                } else {
                    const data = await response.json();
                    alert(data.detail || 'Failed to delete user');
                }
            } catch (err) {
                alert('Error deleting user');
            }
        }

        fetchUsers();
    </script>
</body>

</html>
