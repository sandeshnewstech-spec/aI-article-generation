<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandesh AI | Add ADVT Category</title>
    <link rel="icon" href="/static/favicon.jpeg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; color: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    {% include "sidebar.html" %}

    <div class="sb-offset">
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm">
            <div class="flex items-center gap-4">
                <a href="/admin/advt-categories/list" class="text-slate-400 hover:text-slate-600 transition-colors bg-slate-50 hover:bg-slate-100 p-2 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-black text-slate-900 tracking-tight leading-none">Add ADVT Category</h1>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto custom-scrollbar p-6">
            <div class="w-full max-w-3xl mx-auto">
                <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm p-8 mt-6">
                    <form id="addCategoryForm" onsubmit="submitForm(event)">
                        <div class="mb-6">
                            <label class="block text-xs font-black text-slate-700 uppercase tracking-widest mb-2">Category Name / AD Type <span class="text-red-500">*</span></label>
                            <input type="text" id="catName" required placeholder="e.g. Display" 
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition-all">
                        </div>

                        <div class="mb-8">
                            <label class="block text-xs font-black text-slate-700 uppercase tracking-widest mb-2">Description</label>
                            <textarea id="catDesc" rows="4" placeholder="e.g. All Product ads comes under this category." 
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition-all"></textarea>
                        </div>

                        <div class="flex items-center gap-3 pt-6 border-t border-slate-100">
                            <a href="/admin/advt-categories/list" class="px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition-colors">Cancel</a>
                            <button type="submit" id="submitBtn" class="flex-1 bg-gradient-to-r from-[#e82526] to-[#990d0e] hover:shadow-lg hover:shadow-red-900/20 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition-all text-center flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                                Save Category
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl bg-slate-800 text-white text-sm font-bold shadow-2xl opacity-0 translate-y-4 transition-all z-50 pointer-events-none flex items-center gap-2"></div>

    <script>
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.backgroundColor = isError ? '#ef4444' : '#10b981';
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(1rem)';
            }, 3000);
        }

        async function submitForm(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = 'Saving...';

            const payload = {
                name: document.getElementById('catName').value.trim(),
                description: document.getElementById('catDesc').value.trim()
            };

            try {
                const res = await fetch('/api/advt-categories/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || "Failed to save");
                }
                
                showToast("Category created successfully!");
                setTimeout(() => window.location.href = '/admin/advt-categories/list', 1000);
            } catch (err) {
                showToast(err.message, true);
                btn.disabled = false;
                btn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    Save Category
                `;
            }
        }
    </script>
</body>
</html>
