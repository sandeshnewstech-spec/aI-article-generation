<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandesh AI | ADVT Categories</title>
    <link rel="icon" href="/static/favicon.jpeg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; color: #1e293b; }
        .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; }
        .topbar-title { font-size: 1.25rem; font-weight: 900; color: #0f172a; letter-spacing: -0.025em; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    {% include "sidebar.html" %}

    <div class="sb-offset">
        <!-- We still keep the topbar if you want, or we can make it cleaner like editor.html -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-black text-slate-900 tracking-tight leading-none">ADVT Categories</h1>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a href="/admin/advt-categories/add"
                    class="bg-gradient-to-r from-[#e82526] to-[#990d0e] hover:shadow-lg hover:shadow-red-900/20 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow-md transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Create New
                </a>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto custom-scrollbar p-6">
            <div class="w-full max-w-7xl mx-auto">
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h2 class="text-2xl font-black text-slate-800 tracking-tight">Manage ADVT Categories</h2>
                        <p class="text-sm text-slate-500 mt-1">Add, edit, or remove advertisement categories.</p>
                    </div>
                </div>

                <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[800px]">
                            <thead>
                                <tr class="bg-slate-50/50">
                                    <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 w-1/3">AD Type</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">Description</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="categoryTableBody" class="divide-y divide-slate-50">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                    
                    <div id="loadingState" class="p-12 flex flex-col items-center justify-center">
                        <div class="w-10 h-10 border-4 border-slate-100 border-t-red-600 rounded-full animate-spin mb-4"></div>
                        <p class="text-slate-500 font-semibold text-sm">Loading categories...</p>
                    </div>

                    <div id="emptyState" class="hidden p-16 flex flex-col items-center justify-center text-center">
                        <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-4">
                            <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                            </svg>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-1 tracking-tight">No Categories Found</h3>
                        <p class="text-slate-500 mb-6 max-w-sm text-sm">You haven't added any ADVT categories yet. Create your first category to get started.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function fetchCategories() {
            try {
                const res = await fetch('/api/advt-categories/');
                if (!res.ok) throw new Error("Failed to fetch");
                const categories = await res.json();
                
                document.getElementById('loadingState').classList.add('hidden');
                
                const tbody = document.getElementById('categoryTableBody');
                tbody.innerHTML = '';
                
                if (categories.length === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                    return;
                }
                
                categories.forEach(cat => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-red-50/30 transition-colors group cursor-default';
                    
                    const desc = cat.description || '<span class="text-slate-300 italic">No description</span>';
                    
                    row.innerHTML = `
                        <td class="px-6 py-4">
                            <div class="font-bold text-slate-800 group-hover:text-red-700 transition-colors">${cat.name}</div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-slate-600">${desc}</div>
                        </td>
                        <td class="px-6 py-4 text-right whitespace-nowrap">
                            <div class="flex items-center justify-end gap-3">
                                <a href="/admin/advt-categories/edit/${cat.id}" 
                                    class="text-indigo-600 hover:text-indigo-800 font-bold text-[10px] uppercase tracking-wider px-3 py-1.5 rounded-lg border border-transparent hover:border-indigo-200 hover:bg-indigo-50 transition-all flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                    </svg>
                                    Edit
                                </a>
                                <button onclick="deleteCategory('${cat.id}')" 
                                    class="px-3 py-1.5 bg-red-50 text-red-600 rounded-lg text-[10px] font-bold uppercase tracking-wider hover:bg-red-600 hover:text-white border border-red-200 transition-all shadow-sm flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                    Delete
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error(err);
                alert("Error loading categories");
            }
        }

        async function deleteCategory(id) {
            if (!confirm("Are you sure you want to delete this category?")) return;
            try {
                const res = await fetch(`/api/advt-categories/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error("Delete failed");
                fetchCategories();
            } catch (err) {
                console.error(err);
                alert("Error deleting category");
            }
        }

        document.addEventListener('DOMContentLoaded', fetchCategories);
    </script>
</body>
</html>
