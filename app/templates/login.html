<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandesh AI | Login</title>
    <link rel="icon" href="/static/favicon.jpeg" type="image/jpeg">
    <script src="/static/tailwind.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(at 0% 0%, rgba(174, 10, 11, 0.08) 0, transparent 40%),
                radial-gradient(at 100% 0%, rgba(174, 10, 11, 0.08) 0, transparent 40%),
                radial-gradient(at 50% 50%, rgba(255, 255, 255, 1) 0, transparent 100%),
                #f1f5f9;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .input-focus {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-focus:focus {
            box-shadow: 0 0 0 4px rgba(174, 10, 11, 0.08);
            border-color: #ae0a0b;
            background: #ffffff;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-slate-50 overflow-hidden">
    <div class="w-full max-w-sm">
        <!-- Logo/Brand -->
        <div class="text-center mb-4">
            <div
                class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-lg mb-3 p-2.5 border border-gray-100 dark:border-white/5">
                <img src="/static/favicon.jpeg" alt="Sandesh Logo" class="w-full h-full object-contain rounded-xl">
            </div>
            <h1 class="text-2xl font-black text-[#ae0a0b] tracking-tighter uppercase transition-colors">Sandesh AI</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-1 text-xs font-medium transition-colors">Professional Editorial Workflow</p>
        </div>

        <!-- Login Card -->
        <div class="glass rounded-[1.5rem] p-6 shadow-xl">
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1 uppercase tracking-wider transition-colors">Username</label>
                    <input type="text" id="username" name="username" required
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-900 placeholder-slate-400 input-focus outline-none transition-all"
                        placeholder="admin">
                </div>
                <div>
                    <label for="password" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1 uppercase tracking-wider transition-colors">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-900 placeholder-slate-400 input-focus outline-none transition-all"
                        placeholder="••••••••">
                </div>

                <div id="errorMessage"
                    class="hidden text-red-600 text-sm font-bold bg-red-50 border border-red-100 rounded-xl p-4">
                    Invalid credentials. Please try again.
                </div>

                <button type="submit" id="loginBtn"
                    class="w-full bg-gradient-to-r from-[#ae0a0b] to-[#800607] hover:shadow-lg text-white font-black py-3.5 rounded-lg transition-all active:scale-[0.98] flex items-center justify-center gap-3 uppercase tracking-widest text-xs">
                    <span>Enter Newsroom</span>
                    <svg id="loadingIcon" class="hidden animate-spin h-5 w-5 text-white"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </button>
            </form>
        </div>

        <p class="text-center text-slate-600 text-[9px] mt-4 font-bold uppercase tracking-[0.2em]">
            &copy; 2026 Sandesh AI. All rights reserved.
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('loginBtn');
            const loading = document.getElementById('loadingIcon');
            const error = document.getElementById('errorMessage');

            btn.disabled = true;
            loading.classList.remove('hidden');
            error.classList.add('hidden');

            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token and role
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_role', data.role);
                    localStorage.setItem('username', document.getElementById('username').value);

                    // Redirect to home
                    window.location.href = '/generator';
                } else {
                    error.textContent = data.detail || 'Login failed';
                    error.classList.remove('hidden');
                }
            } catch (err) {
                error.textContent = 'Connection error. Please try again.';
                error.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        });

        // Clear tokens if already logged in but arriving at login page (optional)
        // localStorage.removeItem('access_token');
    </script>
</body>

</html>
