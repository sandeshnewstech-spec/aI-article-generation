<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandesh AI | News Editor Dashboard</title>
    <link rel="icon" href="/static/favicon.jpeg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#e82526',
                            600: '#990d0e',
                            700: '#991b1b',
                        },
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html,
        body {
            overflow: hidden !important;
            height: 100vh !important;
            width: 100vw !important;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body class="bg-white font-sans text-slate-900 antialiased">

    {% include 'sidebar.html' %}

    <main class="sb-offset">
        <!-- Header -->
        <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-3 z-30 shrink-0">
            <div class="flex items-center gap-4">
                <div
                    class="w-10 h-10 bg-gradient-to-br from-[#e82526] to-[#990d0e] rounded-xl flex items-center justify-center text-white shadow-lg shadow-red-900/20">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                </div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-black text-slate-900 tracking-tight leading-none">News Editor</h1>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a href="/editor/workspace"
                    class="bg-gradient-to-r from-[#e82526] to-[#990d0e] hover:shadow-lg hover:shadow-red-900/20 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow-md transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Create New
                </a>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- History Table View -->
            <div id="historyView" class="flex-1 bg-white overflow-y-auto p-6">
                <div class="w-full max-w-7xl mx-auto">
                    <div class="flex items-center justify-between mb-8">
                        <div>
                            <h2 class="text-2xl font-black text-slate-800 tracking-tight">Editorial History</h2>
                            <p class="text-sm text-slate-500 mt-1">Manage and edit your previously saved news reports
                            </p>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="relative">
                                <input type="text" id="editorSearch" oninput="filterEditorHistory()"
                                    placeholder="Search Topic, Date, User..."
                                    class="pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 outline-none w-64">
                                <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"
                                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </div>
                            <button onclick="loadEditorHistory()"
                                class="p-2 text-slate-400 hover:text-blue-600 transition-colors" title="Reload History">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50/50">
                                    <th
                                        class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">
                                        Topic / Headline</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">
                                        User</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">
                                        Date</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 text-center">
                                        Status</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 text-right">
                                        Action</th>
                                </tr>
                            </thead>
                            <tbody id="editorHistoryTableBody" class="divide-y divide-slate-50">
                                <!-- Dynamic -->
                            </tbody>
                        </table>

                        <!-- Pagination Footer -->
                        <div
                            class="px-6 py-4 bg-slate-50/30 border-t border-slate-100 flex items-center justify-between">
                            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest"
                                id="editorPaginationInfo">
                                Showing 0-0 of 0
                            </div>
                            <div class="flex items-center gap-1" id="editorPaginationButtons">
                                <!-- Dynamic -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl bg-slate-800 text-white text-sm font-bold shadow-2xl opacity-0 translate-y-4 transition-all z-[100] pointer-events-none">
    </div>

    <script>
        let editorHistoryItems = [];
        let editorTotalItems = 0;
        let editorTotalPages = 1;
        let editorCurrentPage = 1;
        const itemsPerPage = 10;

        function toast(msg, type = 'success') {
            const el = document.getElementById('toast');
            el.textContent = msg;

            el.classList.remove('bg-slate-800', 'bg-emerald-600', 'bg-rose-600', 'bg-blue-600');
            if (type === 'success') {
                el.classList.add('bg-emerald-600');
            } else if (type === 'error') {
                el.classList.add('bg-rose-600');
            } else if (type === 'info') {
                el.classList.add('bg-blue-600');
            } else {
                el.classList.add('bg-slate-800');
            }

            el.classList.remove('opacity-0', 'translate-y-4');
            el.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                el.classList.add('opacity-0', 'translate-y-4');
                el.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }

        async function loadEditorHistory() {
            const tbody = document.getElementById('editorHistoryTableBody');
            try {
                const query = document.getElementById('editorSearch').value.toLowerCase();
                const res = await fetch(`/api/history/editor?page=${editorCurrentPage}&limit=${itemsPerPage}&search=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                editorHistoryItems = data.items || [];
                editorTotalItems = data.total || 0;
                editorTotalPages = data.total_pages || 1;

                if (editorHistoryItems.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-400 font-bold uppercase tracking-widest text-xs">No editorial history found</td></tr>`;
                    document.getElementById('editorPaginationInfo').innerText = 'Showing 0-0 of 0';
                    document.getElementById('editorPaginationButtons').innerHTML = '';
                    return;
                }

                renderEditorTable();
            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-red-400">Failed to load history</td></tr>`;
            }
        }

        function renderEditorTable() {
            const tbody = document.getElementById('editorHistoryTableBody');
            const start = (editorCurrentPage - 1) * itemsPerPage;

            tbody.innerHTML = editorHistoryItems.map(item => {
                const article = item.articles[item.articles.length - 1] || item.articles[0];
                const date = new Date(item.created_at);
                const dateStr = date.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' });
                const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const username = item.username || item.created_by_name || 'Admin';
                const itemId = item._id || item.id;

                const statusLower = (item.status || '').toLowerCase();
                const isPending = statusLower === 'pending approval' || statusLower === 'pending';

                return `
                    <tr class="hover:bg-red-50/30 transition-colors group cursor-default">
                        <td class="px-6 py-4 max-w-[400px]">
                            <div class="font-bold text-slate-800 truncate group-hover:text-brand-700 transition-colors" title="${article.headline}">${article.headline}</div>
                          
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-[10px] font-bold text-slate-500 border border-slate-200 uppercase">
                                    ${username.charAt(0)}
                                </div>
                                <span class="text-xs font-bold text-slate-600">${username}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex flex-col">
                                <span class="text-xs font-bold text-slate-600">${dateStr}</span>
                                <span class="text-[10px] text-slate-400 font-medium">${timeStr}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-center whitespace-nowrap">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${statusLower === 'approved' ? 'bg-green-100 text-green-700' : isPending ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-600'}">
                                ${isPending ? 'Pending' : (item.status || 'Draft')}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right whitespace-nowrap">
                            <div class="flex items-center justify-end gap-3">
                                ${localStorage.getItem('user_role') === 'super_admin' && isPending ? `
                                    <button onclick="quickUpdateStatus('${itemId}', 'Approved')" class="px-3 py-1.5 bg-green-50 text-green-600 rounded-lg text-[10px] font-bold uppercase hover:bg-green-600 hover:text-white border border-green-200 transition-all shadow-sm">Approve</button>
                                    <button onclick="quickUpdateStatus('${itemId}', 'Rejected')" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-lg text-[10px] font-bold uppercase hover:bg-red-600 hover:text-white border border-red-200 transition-all shadow-sm">Reject</button>
                                ` : ''}
                                <a href="/editor/workspace?id=${itemId}" 
                                    class="text-indigo-600 hover:text-indigo-800 font-bold text-[10px] uppercase tracking-wider px-3 py-1.5 rounded-lg border border-transparent hover:border-indigo-200 hover:bg-indigo-50 transition-all flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                    </svg>
                                    View & Edit
                                </a>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            // Update Info
            const actualEnd = start + editorHistoryItems.length;
            document.getElementById('editorPaginationInfo').innerText = `Showing ${editorHistoryItems.length === 0 ? 0 : start + 1}-${actualEnd} of ${editorTotalItems}`;

            renderEditorPaginationButtons();
        }

        function renderEditorPaginationButtons() {
            const container = document.getElementById('editorPaginationButtons');
            const totalPages = editorTotalPages;
            container.innerHTML = '';

            if (editorTotalItems === 0 || totalPages <= 1) return;

            // Prev
            const prevBtn = document.createElement('button');
            prevBtn.disabled = editorCurrentPage === 1;
            prevBtn.className = `p-1.5 rounded-lg border transition-all ${editorCurrentPage === 1 ? 'text-gray-200 border-gray-100 cursor-not-allowed' : 'text-gray-600 border-gray-200 hover:bg-gray-50'}`;
            prevBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>';
            prevBtn.onclick = () => { 
                if (editorCurrentPage > 1) {
                    editorCurrentPage--; 
                    loadEditorHistory(); 
                }
            };
            container.appendChild(prevBtn);

            // Pages
            for (let i = 1; i <= totalPages; i++) {
                if (totalPages > 5 && i > 2 && i < totalPages - 1 && Math.abs(i - editorCurrentPage) > 1) {
                    if (i === 3 || i === totalPages - 2) {
                        const dot = document.createElement('span');
                        dot.innerText = '...';
                        dot.className = 'px-1 text-slate-400';
                        container.appendChild(dot);
                    }
                    continue;
                }

                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = `w-8 h-8 rounded-lg text-[10px] font-black transition-all ${i === editorCurrentPage ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 border border-transparent hover:border-slate-200 hover:bg-slate-50'}`;
                btn.onclick = () => { editorCurrentPage = i; loadEditorHistory(); };
                container.appendChild(btn);
            }

            // Next
            const nextBtn = document.createElement('button');
            nextBtn.disabled = editorCurrentPage === totalPages;
            nextBtn.className = `p-1.5 rounded-lg border transition-all ${editorCurrentPage === totalPages ? 'text-gray-200 border-gray-100 cursor-not-allowed' : 'text-gray-600 border-gray-200 hover:bg-gray-50'}`;
            nextBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>';
            nextBtn.onclick = () => { 
                if (editorCurrentPage < totalPages) {
                    editorCurrentPage++; 
                    loadEditorHistory(); 
                }
            };
            container.appendChild(nextBtn);
        }

        function filterEditorHistory() {
            editorCurrentPage = 1;
            loadEditorHistory();
        }

        async function quickUpdateStatus(historyId, newStatus) {
            try {
                toast(`Updating to ${newStatus}...`, "info");
                const res = await fetch(`/api/history/${historyId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (res.ok) {
                    toast(`Report ${newStatus}!`, "success");
                    loadEditorHistory();
                }
            } catch (e) {
                console.error(e);
                toast("Failed to update status", "error");
            }
        }

        window.onload = function () {
            loadEditorHistory();
        }
    </script>
</body>

</html>
