{# SHARED SIDEBAR PARTIAL — included in every page via Jinja2 include.
Context var: current_page = "generator" | "categories" | "slots" #}
<style>
  /* ── Sidebar Reset & Base ─────────────────────────────────── */
  html {
    font-size: 14px;
  }

  .sb {
    width: 210px;
    height: 100vh;
    background: #ffffff;
    border-right: 1px solid #e2e8f0;
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    flex-direction: column;
    z-index: 50;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  /* ── Brand ────────────────────────────────────────────────── */
  .sb-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 20px;
    border-bottom: 1px solid #f1f5f9;
    text-decoration: none;
  }

  .sb-brand-img {
    width: 40px;
    height: 40px;
    object-fit: contain;
    background: #fff;
    padding: 4px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .sb-brand-name {
    font-size: 1rem;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.02em;
    line-height: 1;
    text-transform: uppercase;
  }

  .sb-brand-sub {
    font-size: 0.7rem;
    color: #64748b;
    margin-top: 4px;
    font-weight: 500;
  }

  /* ── Nav ──────────────────────────────────────────────────── */
  .sb-nav {
    padding: 20px 12px;
    flex: 1;
    overflow-y: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .sb-nav::-webkit-scrollbar {
    display: none;
  }

  .sb-section {
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #52525b;
    padding: 12px 10px 8px;
  }

  .sb-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 500;
    color: #475569;
    text-decoration: none;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    margin-bottom: 4px;
  }

  .sb-link:hover {
    background: #f1f5f9;
    color: #0f172a;
  }

  .sb-link.active {
    background: linear-gradient(135deg, #ae0a0b 0%, #800607 100%);
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(174, 10, 11, 0.3);
  }

  .sb-link svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    opacity: 0.9;
  }

  .sb-link.active svg {
    opacity: 1;
  }

  .sb-link-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Footer ───────────────────────────────────────────────── */
  .sb-footer {
    padding: 12px 20px 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }

  .sb-footer-label {
    font-size: 0.68rem;
    color: #334155;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 7px;
  }

  .sb-db-row {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .sb-db-dot {
    width: 7px;
    height: 7px;
    background: #22c55e;
    border-radius: 50%;
    animation: sb-pulse 2.2s ease-in-out infinite;
    flex-shrink: 0;
  }

  .sb-db-text {
    font-size: 0.72rem;
    color: #4ade80;
    font-weight: 600;
  }

  @keyframes sb-pulse {

    0%,
    100% {
      opacity: 1;
      transform: scale(1)
    }

    50% {
      opacity: .5;
      transform: scale(.85)
    }
  }

  /* ── App main offset — used by every page ─────────────────── */
  .sb-offset {
    margin-left: 240px;
    width: stretch;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
</style>

<aside class="sb" id="appSidebar">

  <!-- Brand -->
  <a href="/generator" class="sb-brand">
    <img src="/static/favicon.jpeg" alt="Sandesh" class="sb-brand-img">
    <div>
      <div class="sb-brand-name">Sandesh AI</div>
      <div class="sb-brand-sub">Admin Panel</div>
    </div>
  </a>

  <!-- Navigation -->
  <nav class="sb-nav">

    <div class="sb-section">Generate</div>
    <a href="/generator" class="sb-link {% if current_page == 'generator' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
      <span class="sb-link-label">AI Draft Desk</span>
    </a>
    <a href="/editor" class="sb-link {% if current_page == 'editor' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
      <span class="sb-link-label">News Editor</span>
    </a>
    <a href="/full-newspaper" class="sb-link {% if current_page == 'full_newspaper' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
      </svg>
      <span class="sb-link-label">Full Newspaper</span>
    </a>
    </a>

    <div class="sb-section" style="margin-top:8px">Admin</div>
    <a href="/admin/categories" class="sb-link {% if current_page == 'categories' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2
          2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
      </svg>
      <span class="sb-link-label">Categories &amp; Sources</span>
    </a>
    <a href="/admin/slots" class="sb-link {% if current_page == 'slots' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z
          M14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z
          M4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2z
          M14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
      </svg>
      <span class="sb-link-label">Slot Manager</span>
    </a>
    <a href="/admin/users" id="sbLinkUsers" class="sb-link {% if current_page == 'users' %}active{% endif %}"
      style="display:none">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <span class="sb-link-label">Users</span>
    </a>

  </nav>

  <!-- Footer -->
  <div class="sb-footer" style="border-top: 1px solid #f1f5f9">

    <!-- Logout -->
    <div class="mt-4 pt-4 border-t border-gray-100">
      <button onclick="logout()"
        class="flex items-center gap-2 text-xs font-semibold text-slate-500 hover:text-red-400 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Logout
      </button>
    </div>
  </div>

  <script>
    function checkAuth() {
      const token = localStorage.getItem('access_token');
      const role = localStorage.getItem('user_role');
      const path = window.location.pathname;

      if (!token && path !== '/login' && path !== '/') {
        window.location.href = '/login';
        return;
      }

      // If logged in and on root or login page, go to generator
      if (token && (path === '/' || path === '/login')) {
        window.location.href = '/generator';
        return;
      }

      if (role === 'super_admin') {
        const userLink = document.getElementById('sbLinkUsers');
        if (userLink) userLink.style.display = 'flex';
      }

      // Update brand sub with username if available
      const username = localStorage.getItem('username');
      if (username) {
        const sub = document.querySelector('.sb-brand-sub');
        if (sub) sub.textContent = username.charAt(0).toUpperCase() + username.slice(1) + ' (' + (role === 'super_admin' ? 'Admin' : 'User') + ')';
      }
    }

    function logout() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('user_role');
      localStorage.removeItem('username');
      window.location.href = '/login';
    }

    // Run on load
    if (window.location.pathname !== '/login' && window.location.pathname !== '/') {
      checkAuth();
    } else if (localStorage.getItem('access_token')) {
      // Even on login page, if token exists, check if we should redirect
      checkAuth();
    }
  </script>
</aside>
