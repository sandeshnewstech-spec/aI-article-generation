<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandesh AI | ADVT Module</title>
    <link rel="icon" href="/static/favicon.jpeg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <!-- Include Fabric.js and jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#e82526',
                            600: '#990d0e',
                            700: '#991b1b',
                        },
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html,
        body {
            overflow: hidden !important;
            height: 100vh !important;
            width: 100vw !important;
            margin: 0;
            padding: 0;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 24px;
            border: 1px solid #888;
            width: 80%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>

<body class="bg-white font-sans text-slate-900 antialiased">

    {% include 'sidebar.html' %}

    <main class="sb-offset">
        <!-- Header -->
        <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-3 z-30 shrink-0">
            <div class="flex items-center gap-4">
                <div
                    class="w-10 h-10 bg-gradient-to-br from-red-500 to-brand-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-brand-700/20">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                    </svg>
                </div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-black text-slate-900 tracking-tight leading-none">Advertisement (ADVT)
                        Manager</h1>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="openUploadModal()"
                    class="bg-gradient-to-r from-red-600 to-brand-600 hover:shadow-lg hover:shadow-brand-700/20 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow-md transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    Upload ADVT
                </button>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <div class="flex-1 bg-slate-50 overflow-y-auto p-6">
                <div class="w-full max-w-7xl mx-auto">

                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr
                                    class="bg-slate-50 border-b border-slate-100 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                                    <th class="p-4 pl-6">Filename</th>
                                    <th class="p-4">Type</th>
                                    <th class="p-4">Date</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4 pr-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="advtTableBody" class="divide-y divide-slate-100 text-sm">
                                <!-- Data will be loaded here -->
                                <tr>
                                    <td colspan="5" class="p-8 text-center text-slate-500">Loading advertisements...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-xl font-bold text-slate-800">Upload Advertisement</h2>
                <button onclick="closeUploadModal()" class="text-slate-400 hover:text-slate-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <form id="uploadForm" onsubmit="handleUpload(event)">
                <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <label class="block text-sm font-semibold text-slate-700 mb-3">Processing Options</label>
                    <div class="flex flex-col gap-3">
                        <label class="flex items-center gap-3 text-sm text-slate-700 cursor-pointer">
                            <input type="checkbox" id="optEngToGuj"
                                class="w-4 h-4 text-brand-600 border-slate-300 rounded focus:ring-brand-500" checked
                                onchange="toggleDimensions()">
                            <span class="font-medium">English to Gujarati</span>
                        </label>
                        <label class="flex items-center gap-3 text-sm text-slate-700 cursor-pointer">
                            <input type="checkbox" id="optAddKeyPoints"
                                class="w-4 h-4 text-brand-600 border-slate-300 rounded focus:ring-brand-500"
                                onchange="toggleDimensions()">
                            <span class="font-medium">Add KeyPoints</span>
                        </label>
                        <label class="flex items-center gap-3 text-sm text-slate-700 cursor-pointer">
                            <input type="checkbox" id="optLegalNotice"
                                class="w-4 h-4 text-brand-600 border-slate-300 rounded focus:ring-brand-500"
                                onchange="toggleDimensions()">
                            <span class="font-medium">Legal Notice</span>
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Advertisement Type</label>
                        <select id="advtType" required
                            class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                            <option value="" disabled selected>Loading categories...</option>
                        </select>
                    </div>
                    <div id="unitContainer">
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Unit</label>
                        <select id="advtUnit"
                            class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                            <option value="cm">cm</option>
                            <option value="meter">meter</option>
                        </select>
                    </div>
                    <div id="heightContainer">
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Height</label>
                        <input type="number" id="advtHeight" step="0.01"
                            class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
                            placeholder="0.00">
                    </div>
                    <div id="widthContainer">
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Width</label>
                        <input type="number" id="advtWidth" step="0.01"
                            class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
                            placeholder="0.00">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Select Creative Ad File (PDF, DOCX,
                        Image)</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="advtFile"
                            class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-300 border-dashed rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-8 h-8 mb-2 text-slate-500" aria-hidden="true"
                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2" />
                                </svg>
                                <p class="mb-1 text-sm text-slate-500 font-semibold">Click to upload creative ad</p>
                                <p class="text-xs text-slate-500">PDF, DOCX, PNG, JPG</p>
                            </div>
                            <input id="advtFile" type="file" class="hidden" accept=".pdf,.docx,.png,.jpg,.jpeg" required
                                onchange="updateFileName(this)" />
                        </label>
                    </div>
                    <p id="selectedFileName" class="mt-2 text-sm text-brand-600 font-medium text-center hidden"></p>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Select Blank Template (Image or PDF)
                        - Optional</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="advtBlankFile"
                            class="flex flex-col items-center justify-center w-full h-24 border-2 border-slate-300 border-dashed rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors">
                            <div class="flex flex-col items-center justify-center pt-4 pb-4">
                                <p class="mb-1 text-sm text-slate-500 font-semibold">Click to upload blank template</p>
                                <p class="text-xs text-slate-500">PNG, JPG, PDF</p>
                            </div>
                            <input id="advtBlankFile" type="file" class="hidden" accept=".png,.jpg,.jpeg,.pdf"
                                onchange="updateBlankFileName(this)" />
                        </label>
                    </div>
                    <p id="selectedBlankFileName" class="mt-2 text-sm text-brand-600 font-medium text-center hidden">
                    </p>
                </div>

                <div id="uploadProgress" class="hidden mb-6">
                    <div class="flex items-center gap-3 text-brand-600 font-medium">
                        <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        <span>Generating Advertisement text and images with AI...</span>
                    </div>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeUploadModal()"
                        class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg font-medium hover:bg-slate-200">Cancel</button>
                    <button type="submit" id="uploadBtn"
                        class="px-6 py-2 bg-brand-600 text-white rounded-lg font-medium hover:bg-brand-700 shadow-sm transition-colors">Upload
                        & Translate</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-xl font-bold text-slate-800">Edit Translated Text</h2>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Advertisement Details</label>
                <div class="flex gap-4 mb-2 text-sm text-slate-600 bg-slate-50 p-3 rounded-lg border border-slate-200"
                    id="editAdvtDetails">
                    <!-- Details will be injected here -->
                </div>
            </div>

            <div class="mb-6">
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-semibold text-slate-700">Generated Advertisement Text (Gujarati)</label>
                </div>
                
                <!-- Dynamic inputs will be inserted here -->
                <div id="editBlocksContainer" class="flex flex-col gap-4"></div>
                
                <!-- Hidden textarea to store actual JSON data for backend -->
                <textarea id="editTranslationText" style="display:none;"></textarea>
                <div class="mt-2 flex justify-end">
                    <button type="button" onclick="updateCanvasFromText()"
                        class="px-4 py-2 bg-brand-100 text-brand-700 font-semibold rounded-lg hover:bg-brand-200 transition-colors">
                        Update Canvas Preview
                    </button>
                </div>
            </div>

            <div class="mb-6" id="editImageContainer" style="display:none;">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Advertisement Canvas (Drag & Edit
                    Text)</label>
                <div
                    class="border border-slate-200 rounded-xl overflow-hidden bg-slate-50 flex flex-col items-center justify-center p-2">

                    <div class="flex items-center gap-3 mb-3 p-2 bg-white border border-slate-200 rounded-lg shadow-sm w-full max-w-xl"
                        id="canvasToolbar" style="opacity: 0.5; pointer-events: none; transition: 0.2s;">
                        <div class="flex items-center gap-2">
                            <label class="text-xs font-semibold text-slate-600">Size:</label>
                            <input type="number" id="tbFontSize"
                                class="w-16 p-1 text-sm border border-slate-300 rounded focus:outline-none focus:border-brand-500"
                                value="12" onchange="updateSelectedText('fontSize', this.value)">
                        </div>
                        <div class="h-5 w-px bg-slate-300 mx-1"></div>
                        <button type="button" id="tbBold"
                            class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-100 text-slate-700 font-black border border-transparent transition-colors"
                            title="Bold" onclick="toggleBold()">B</button>
                        <div class="h-5 w-px bg-slate-300 mx-1"></div>
                        <div class="flex items-center gap-1">
                            <button type="button"
                                class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-100 text-slate-600 border border-transparent"
                                title="Align Left" onclick="updateSelectedText('textAlign', 'left')">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 6h16M4 12h10M4 18h16"></path>
                                </svg>
                            </button>
                            <button type="button"
                                class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-100 text-slate-600 border border-transparent"
                                title="Align Center" onclick="updateSelectedText('textAlign', 'center')">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 6h16M7 12h10M4 18h16"></path>
                                </svg>
                            </button>
                            <button type="button"
                                class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-100 text-slate-600 border border-transparent"
                                title="Align Right" onclick="updateSelectedText('textAlign', 'right')">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 6h16M10 12h10M4 18h16"></path>
                                </svg>
                            </button>
                            <button type="button"
                                class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-100 text-slate-600 border border-transparent"
                                title="Justify" onclick="updateSelectedText('textAlign', 'justify')">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 6h16M4 12h16M4 18h16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div id="canvasWrapper" class="relative max-w-full">
                        <canvas id="advtCanvas"></canvas>
                    </div>
                    <div class="mt-4 flex gap-3">
                        <button type="button" onclick="downloadCanvas('png')"
                            class="px-4 py-2 bg-blue-50 text-blue-700 border border-blue-200 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-600 hover:text-white transition-colors">
                            Download PNG
                        </button>
                        <button type="button" onclick="downloadCanvas('pdf')"
                            class="px-4 py-2 bg-purple-50 text-purple-700 border border-purple-200 rounded-lg text-sm font-bold shadow-sm hover:bg-purple-600 hover:text-white transition-colors">
                            Download PDF
                        </button>
                    </div>
                </div>
            </div>

            <input type="hidden" id="editAdvtId">

            <div class="flex justify-end gap-3">
                <button type="button" onclick="closeEditModal()"
                    class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg font-medium hover:bg-slate-200">Cancel</button>
                <button type="button" onclick="saveTranslation()"
                    class="px-6 py-2 bg-brand-600 text-white rounded-lg font-medium hover:bg-brand-700 shadow-sm transition-colors">Save
                    Changes</button>
            </div>
        </div>
    </div>

    <script>
        let advts = [];
        let advtCategories = [];

        async function loadCategories() {
            try {
                const response = await fetch('/api/advt-categories/');
                if (!response.ok) throw new Error('Failed to load categories');
                advtCategories = await response.json();

                const select = document.getElementById('advtType');
                select.innerHTML = '<option value="" disabled selected>Select Category...</option>';

                advtCategories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.name;
                    option.textContent = cat.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Error loading categories:", error);
                const select = document.getElementById('advtType');
                select.innerHTML = '<option value="" disabled selected>Error loading categories</option>';
            }
        }

        async function loadAdvts() {
            try {
                const response = await fetch('/api/advt/');
                advts = await response.json();
                renderTable();
            } catch (error) {
                console.error("Error loading advts:", error);
                document.getElementById('advtTableBody').innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">Failed to load data</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('advtTableBody');
            if (advts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">No advertisements found.</td></tr>`;
                return;
            }

            tbody.innerHTML = advts.map(advt => {
                const date = new Date(advt.created_at).toLocaleString();
                let typeIcon = '';
                if (advt.file_type.includes('pdf')) typeIcon = '📄 PDF';
                else if (advt.file_type.includes('image')) typeIcon = '🖼️ Image';
                else typeIcon = '📝 Word';

                return `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-4 pl-6 font-medium text-slate-800">${advt.filename}</td>
                    <td class="p-4 text-slate-500">
                        <span class="px-2 py-1 bg-slate-100 rounded-md text-xs font-semibold">${typeIcon}</span>
                    </td>
                    <td class="p-4 text-slate-500 text-sm">${date}</td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 rounded-full text-[11px] font-bold tracking-wide uppercase bg-green-100 text-green-700 border border-green-200">
                            ${advt.status}
                        </span>
                    </td>
                    <td class="p-4 pr-6 text-right">
                        <div class="flex items-center justify-end gap-3">
                            <button onclick="openEditModal('${advt._id}')" 
                                class="text-indigo-600 hover:text-indigo-800 font-bold text-[10px] uppercase tracking-wider px-3 py-1.5 rounded-lg border border-transparent hover:border-indigo-200 hover:bg-indigo-50 transition-all flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                </svg>
                                Edit
                            </button>
                            <button onclick="deleteAdvt('${advt._id}')" 
                                class="px-3 py-1.5 bg-red-50 text-red-600 rounded-lg text-[10px] font-bold uppercase tracking-wider hover:bg-red-600 hover:text-white border border-red-200 transition-all shadow-sm flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                                Delete
                            </button>
                        </div>
                    </td>
                </tr>
                `;
            }).join('');
        }

        function updateFileName(input) {
            const label = document.getElementById('selectedFileName');
            if (input.files && input.files[0]) {
                label.textContent = `Selected file: ${input.files[0].name}`;
                label.classList.remove('hidden');
            } else {
                label.classList.add('hidden');
            }
        }

        function updateBlankFileName(input) {
            const label = document.getElementById('selectedBlankFileName');
            if (input.files && input.files[0]) {
                label.textContent = `Selected template: ${input.files[0].name}`;
                label.classList.remove('hidden');
            } else {
                label.classList.add('hidden');
            }
        }

        let fabricCanvas = null;

        async function handleUpload(e) {
            e.preventDefault();
            const fileInput = document.getElementById('advtFile');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Please select a creative file first.');
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            const blankFileInput = document.getElementById('advtBlankFile');
            if (blankFileInput && blankFileInput.files.length > 0) {
                formData.append('blank_file', blankFileInput.files[0]);
            }

            formData.append('advt_type', document.getElementById('advtType').value);

            let h = document.getElementById('advtHeight').value;
            let w = document.getElementById('advtWidth').value;
            formData.append('height', h ? h : "0");
            formData.append('width', w ? w : "0");
            formData.append('unit', document.getElementById('advtUnit').value || "cm");

            // Processing options
            formData.append('eng_to_guj', document.getElementById('optEngToGuj').checked);
            formData.append('add_keypoints', document.getElementById('optAddKeyPoints').checked);
            formData.append('legal_notice', document.getElementById('optLegalNotice').checked);

            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('uploadProgress').classList.remove('hidden');

            try {
                const response = await fetch('/api/advt/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Upload failed');
                }

                const resData = await response.json();

                closeUploadModal();
                await loadAdvts();

                // Automatically open the canvas to show the user what happened!
                if (resData && resData.data && resData.data._id) {
                    openEditModal(resData.data._id);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                document.getElementById('uploadBtn').disabled = false;
                document.getElementById('uploadProgress').classList.add('hidden');
                fileInput.value = '';
                updateFileName(fileInput);
            }
        }

        function renderEditBlocks(jsonStr) {
            const container = document.getElementById('editBlocksContainer');
            container.innerHTML = '';
            
            if (!jsonStr) return;
            
            try {
                let parsedData = JSON.parse(jsonStr);
                let blocks = [];
                if (Array.isArray(parsedData)) {
                    blocks = parsedData;
                } else if (parsedData && Array.isArray(parsedData.gujarati_text)) {
                    blocks = parsedData.gujarati_text;
                }
                
                if (blocks.length > 0) {
                    blocks.forEach((block, index) => {
                        const div = document.createElement('div');
                        
                        const typeLabel = (block.type || 'Text Block').toUpperCase();
                        const label = document.createElement('label');
                        label.className = 'block text-xs font-bold text-slate-500 mb-1 tracking-wider';
                        label.innerText = typeLabel;
                        
                        const ta = document.createElement('textarea');
                        ta.className = 'block-editor-input w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none text-slate-800 text-base leading-relaxed resize-y';
                        ta.value = block.text || '';
                        ta.dataset.index = index;
                        const textContent = block.text || '';
                        const lineCount = textContent.split('\n').length;
                        const estimatedRows = Math.max(lineCount, Math.ceil(textContent.length / 80));
                        ta.rows = Math.max(2, Math.min(20, estimatedRows));
                        
                        div.appendChild(label);
                        div.appendChild(ta);
                        container.appendChild(div);
                    });
                } else {
                    throw new Error("No array blocks found");
                }
            } catch(e) {
                // Fallback to a single textarea if JSON is invalid or not an array
                const ta = document.createElement('textarea');
                ta.className = 'block-editor-input w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none resize-none font-medium text-slate-800 text-lg leading-relaxed';
                ta.value = jsonStr;
                ta.rows = 8;
                container.appendChild(ta);
            }
        }

        function openEditModal(id) {
            const advt = advts.find(a => a._id === id);
            if (advt) {
                document.getElementById('editAdvtId').value = id;
                document.getElementById('editTranslationText').value = advt.translated_text || '';
                renderEditBlocks(advt.translated_text || '');

                const detailsContainer = document.getElementById('editAdvtDetails');
                detailsContainer.innerHTML = `
                    <div><strong>Type:</strong> ${advt.advt_type || 'N/A'}</div>
                    <div><strong>Size:</strong> ${advt.height || 0} x ${advt.width || 0} ${advt.unit || ''}</div>
                `;

                const imageContainer = document.getElementById('editImageContainer');

                if (advt.generated_image_url) {
                    imageContainer.style.display = 'block';
                    document.getElementById('editModal').style.display = "block";

                    setTimeout(() => {
                        if (!fabricCanvas) {
                            fabricCanvas = new fabric.Canvas('advtCanvas');
                            setupCanvasEvents();
                        }
                        fabricCanvas.clear();

                        fabric.Image.fromURL(advt.generated_image_url, function (img) {
                            const wrapperWidth = document.getElementById('canvasWrapper').clientWidth;
                            let scale = 1;
                            if (img.width > wrapperWidth && wrapperWidth > 0) {
                                scale = wrapperWidth / img.width;
                            } else if (img.width > 700) {
                                scale = 700 / img.width; // Fallback max width
                            }

                            fabricCanvas.setWidth(img.width * scale);
                            fabricCanvas.setHeight(img.height * scale);

                            fabricCanvas.setBackgroundImage(img, fabricCanvas.renderAll.bind(fabricCanvas), {
                                scaleX: scale,
                                scaleY: scale
                            });

                            if (advt.translated_text) {
                                try {
                                    let parsedData = JSON.parse(advt.translated_text);
                                    let blocks = [];
                                    if (Array.isArray(parsedData)) {
                                        blocks = parsedData;
                                    } else if (parsedData && Array.isArray(parsedData.gujarati_text)) {
                                        blocks = parsedData.gujarati_text;
                                    }

                                    if (blocks.length > 0) {
                                        // Sort text blocks by their top Y-coordinate to process them top-to-bottom
                                        let sortedBlocks = [...blocks].sort((a, b) => (a.top_percent || 0) - (b.top_percent || 0));
                                        let textObjects = [];
                                        // Robust check for Legal Notice: either type matches, OR the AI output is missing 'top_percent' entirely
                                        const formAdvtTypeStr = document.getElementById('advtType') ? document.getElementById('advtType').value.toLowerCase() : '';
                                        const advtTypeStr = (advt.advt_type || '').toLowerCase();
                                        const isLegalType = advtTypeStr.includes('legal') || formAdvtTypeStr.includes('legal') || blocks.length > 0 && blocks.every(b => b.top_percent === undefined);

                                        if (isLegalType) {
                                            // Deterministic Sequential Layout Engine for Legal Notice
                                            const cWidth = img.width * scale;
                                            let cHeight = img.height * scale;

                                            // Draw outer border
                                            const borderRect = new fabric.Rect({
                                                left: 4,
                                                top: 4,
                                                width: cWidth - 8,
                                                height: cHeight - 8,
                                                fill: 'transparent',
                                                stroke: '#000000',
                                                strokeWidth: 2,
                                                selectable: true,
                                                strokeUniform: true,
                                                id: 'mainBorder'
                                            });
                                            borderRect.setControlsVisibility({
                                                mt: false, mb: true, ml: false, mr: false, bl: false, br: false, tl: false, tr: false, mtr: false
                                            });
                                            textObjects.push(borderRect);

                                            // Detect if we should use 2 columns based on canvas width (e.g., width > 600 corresponds to 15cm+)
                                            const isTwoColumn = true; // Always 2 columns for legal notice
                                            const padding = 10;

                                            // Draw center line
                                            const centerLine = new fabric.Line([cWidth / 2, 5, cWidth / 2, cHeight - 5], {
                                                stroke: '#000000',
                                                strokeWidth: 1,
                                                selectable: false,
                                                id: 'centerLine'
                                            });
                                            textObjects.push(centerLine);

                                            const colWidth = (cWidth / 2) - (padding * 1.5);
                                            let leftVals = [padding, (cWidth / 2) + (padding / 2)];

                                            // Separate blocks
                                            let headingBlock = blocks.find(b => (b.type || '').toLowerCase() === 'heading' || (b.text && b.text.includes('જાહેર નોટિસ')));
                                            let advocateBlocks = blocks.filter(b => (b.type || '').toLowerCase() === 'advocate');
                                            let contentBlocks = blocks.filter(b => b !== headingBlock && !advocateBlocks.includes(b));

                                            let col0_Y = padding;
                                            let col1_Y = padding;

                                            // 1. Draw Heading in left column only without spacing inside border
                                            if (headingBlock) {
                                                // Background rect for heading to prevent font ascenders from bleeding
                                                const headingBg = new fabric.Rect({
                                                    left: 4,
                                                    top: 4,
                                                    width: (cWidth / 2) - 4,
                                                    height: 35,
                                                    fill: '#000000',
                                                    selectable: false
                                                });
                                                textObjects.push(headingBg);

                                                const textObj = new fabric.Textbox(headingBlock.text || 'જાહેર નોટિસ', {
                                                    left: 4,
                                                    top: 10,
                                                    width: (cWidth / 2) - 4,
                                                    fontSize: 20,
                                                    fill: '#FFFFFF',
                                                    fontWeight: '900',
                                                    fontFamily: 'Gopika',
                                                    textAlign: 'center',
                                                    lineHeight: 1.15,
                                                    shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.65)', blur: 5, offsetX: 1, offsetY: 1 })
                                                });
                                                if (typeof textObj.initDimensions === 'function') textObj.initDimensions();
                                                else if (typeof textObj._initDimensions === 'function') textObj._initDimensions();
                                                textObjects.push(textObj);

                                                if (textObj.height > 25) {
                                                    headingBg.set({ height: textObj.height + 10 });
                                                }

                                                let hOffset = headingBg.height;
                                                col0_Y = 5 + hOffset + 5;
                                                // Note: col1_Y remains untouched, so right column text starts at the top
                                            }

                                            // 2. Merge Content and Split in Half (Account for Advocate Block)
                                            // Replace single newlines with spaces so fabric.js can naturally wrap and justify text without huge gaps.
                                            let fullContentText = contentBlocks.map(b => {
                                                return (b.text || '').split('\n\n').map(p => p.replace(/\n/g, ' ')).join('\n\n');
                                            }).join('\n\n');
                                            let advText = advocateBlocks.map(b => b.text).join('\n');

                                            // 2.5 Calculate Advocate Height in advance to balance columns
                                            let advocateHeight = 0;
                                            if (advocateBlocks.length > 0) {
                                                advocateHeight += 10;
                                                advocateBlocks.forEach((b, idx) => {
                                                    let textLower = (b.text || '').toLowerCase();
                                                    let isName = idx === 0 || textLower.includes('advocate') || textLower.includes('એડવોકેટ');
                                                    let t = new fabric.Textbox(b.text, { width: colWidth, fontSize: 11, fontWeight: isName ? '900' : 'normal', fontFamily: 'Gopika', lineHeight: 1.15 });
                                                    if (typeof t.initDimensions === 'function') t.initDimensions(); else if (typeof t._initDimensions === 'function') t._initDimensions();
                                                    advocateHeight += t.height + 2;
                                                });
                                                advocateHeight += 12;
                                            }

                                            // Binary search to find optimal split point for balanced column heights
                                            let bestSplitIdx = Math.floor(fullContentText.length / 2);
                                            let minDiff = Infinity;
                                            let low = 0;
                                            let high = fullContentText.length;

                                            for (let iter = 0; iter < 12; iter++) {
                                                let mid = Math.floor((low + high) / 2);
                                                let tempSpaceIdx = fullContentText.lastIndexOf(' ', mid);
                                                if (tempSpaceIdx === -1 || tempSpaceIdx < mid - 50) tempSpaceIdx = mid;

                                                let leftStr = fullContentText.substring(0, tempSpaceIdx).trim();
                                                let rightStr = fullContentText.substring(tempSpaceIdx).trim();

                                                let tL = new fabric.Textbox(leftStr, { width: colWidth, fontSize: 11, fontFamily: 'Gopika', textAlign: 'justify', lineHeight: 1.15 });
                                                if (typeof tL.initDimensions === 'function') tL.initDimensions(); else if (typeof tL._initDimensions === 'function') tL._initDimensions();

                                                let tR = new fabric.Textbox(rightStr, { width: colWidth, fontSize: 11, fontFamily: 'Gopika', textAlign: 'justify', lineHeight: 1.15 });
                                                if (typeof tR.initDimensions === 'function') tR.initDimensions(); else if (typeof tR._initDimensions === 'function') tR._initDimensions();

                                                let totalLeftH = col0_Y + tL.height + 4;
                                                let totalRightH = col1_Y + tR.height + 4 + advocateHeight;

                                                let diff = totalLeftH - totalRightH;
                                                if (Math.abs(diff) < minDiff) {
                                                    minDiff = Math.abs(diff);
                                                    bestSplitIdx = tempSpaceIdx;
                                                }

                                                if (diff > 0) {
                                                    high = mid - 1;
                                                } else {
                                                    low = mid + 1;
                                                }
                                            }

                                            let spaceIdx = bestSplitIdx;
                                            let leftContent = fullContentText.substring(0, spaceIdx).trim();
                                            let rightContent = fullContentText.substring(spaceIdx).trim();

                                            // Draw Left Content
                                            if (leftContent) {
                                                const textObjL = new fabric.Textbox(leftContent, {
                                                    left: leftVals[0],
                                                    top: col0_Y,
                                                    width: colWidth,
                                                    fontSize: 11,
                                                    fill: '#000000',
                                                    fontFamily: 'Gopika',
                                                    textAlign: 'justify',
                                                    lineHeight: 1.15
                                                });
                                                if (typeof textObjL.initDimensions === 'function') textObjL.initDimensions();
                                                else if (typeof textObjL._initDimensions === 'function') textObjL._initDimensions();
                                                textObjects.push(textObjL);
                                                col0_Y += textObjL.height + 4;
                                            }

                                            // Draw Right Content
                                            if (rightContent) {
                                                const textObjR = new fabric.Textbox(rightContent, {
                                                    left: leftVals[1],
                                                    top: col1_Y,
                                                    width: colWidth,
                                                    fontSize: 11,
                                                    fill: '#000000',
                                                    fontFamily: 'Gopika',
                                                    textAlign: 'justify',
                                                    lineHeight: 1.15
                                                });
                                                if (typeof textObjR.initDimensions === 'function') textObjR.initDimensions();
                                                else if (typeof textObjR._initDimensions === 'function') textObjR._initDimensions();
                                                textObjects.push(textObjR);
                                                col1_Y += textObjR.height + 4;
                                            }

                                            // 3. Draw Advocate info at the bottom of Right Column
                                            if (advocateBlocks.length > 0) {
                                                col1_Y += 10;
                                                advocateBlocks.forEach((b, idx) => {
                                                    let textLower = (b.text || '').toLowerCase();
                                                    let isName = idx === 0 || textLower.includes('advocate') || textLower.includes('એડવોકેટ');
                                                    const textObjAdv = new fabric.Textbox(b.text, {
                                                        left: leftVals[1],
                                                        top: col1_Y,
                                                        width: colWidth,
                                                        fontSize: 11,
                                                        fill: '#000000',
                                                        fontWeight: isName ? '900' : 'normal',
                                                        fontFamily: 'Gopika',
                                                        textAlign: 'right',
                                                        lineHeight: 1.15
                                                    });
                                                    if (typeof textObjAdv.initDimensions === 'function') textObjAdv.initDimensions();
                                                    else if (typeof textObjAdv._initDimensions === 'function') textObjAdv._initDimensions();
                                                    textObjects.push(textObjAdv);
                                                    col1_Y += textObjAdv.height + 2;
                                                });
                                                col1_Y += 12;
                                            }

                                            // 4. Dynamic Canvas Height Adjustment (Shrink or Expand to fit text exactly)
                                            let maxY = Math.max(col0_Y, col1_Y) + padding;

                                            cHeight = maxY;
                                            fabricCanvas.setHeight(cHeight);
                                            // Fill the background white to hide any original text that might have been there
                                            const whiteBg = new fabric.Rect({
                                                left: 0, top: 0, width: cWidth, height: cHeight, fill: '#FFFFFF', selectable: false
                                            });
                                            // Insert whiteBg at the very beginning of textObjects
                                            textObjects.unshift(whiteBg);

                                            borderRect.set({ height: cHeight - 8 });
                                            centerLine.set({ y2: cHeight - 5 });

                                        } else {
                                            // Standard layout engine for other advertisement types
                                            sortedBlocks.forEach(block => {
                                                const cWidth = img.width * scale;
                                                const cHeight = img.height * scale;

                                                const isWhite = block.color && block.color.toUpperCase() === '#FFFFFF';
                                                const isBold = block.font_weight && block.font_weight.toLowerCase() === 'bold';

                                                // Extract percentages
                                                let top_p = block.top_percent !== undefined ? block.top_percent : 20;
                                                let left_p = block.left_percent !== undefined ? block.left_percent : 10;
                                                let width_p = block.width_percent !== undefined ? block.width_percent : 80;

                                                let align = block.text_align ? block.text_align.toLowerCase() : 'left';
                                                if (align === 'left') {
                                                    width_p = Math.max(width_p, 95 - left_p);
                                                }

                                                let top_val = (top_p / 100) * cHeight;
                                                let left_val = (left_p / 100) * cWidth;
                                                let width_val = (width_p / 100) * cWidth;

                                                let font_size_p = block.font_size_percent !== undefined ? block.font_size_percent : 3.0;
                                                let finalFontSize = block.font_size_px !== undefined ? block.font_size_px : (font_size_p / 100) * cHeight;

                                                const longestWord = (block.text || '').split(' ').reduce((a, b) => a.length > b.length ? a : b, "");
                                                if (longestWord.length > 0) {
                                                    const maxFontForWord = width_val / (longestWord.length * 0.55);
                                                    finalFontSize = Math.min(finalFontSize, maxFontForWord);
                                                }

                                                const textObj = new fabric.Textbox(block.text || '', {
                                                    left: left_val,
                                                    top: top_val,
                                                    width: width_val,
                                                    fontSize: finalFontSize,
                                                    fill: block.color || '#000000',
                                                    backgroundColor: block.background_color || null,
                                                    fontWeight: isBold ? '900' : 'normal',
                                                    fontFamily: block.font_family || 'Inter',
                                                    textAlign: block.text_align || 'left',
                                                    lineHeight: 1.1,
                                                    shadow: isWhite ? new fabric.Shadow({ color: 'rgba(0,0,0,0.65)', blur: 5, offsetX: 1, offsetY: 1 }) : null
                                                });

                                                if (typeof textObj.initDimensions === 'function') {
                                                    textObj.initDimensions();
                                                } else if (typeof textObj._initDimensions === 'function') {
                                                    textObj._initDimensions();
                                                }

                                                textObjects.push(textObj);
                                            });
                                        }

                                        // 3. Add to canvas
                                        textObjects.forEach(textObj => {
                                            fabricCanvas.add(textObj);
                                        });
                                    } else {
                                        throw new Error("Parsed JSON is not an array");
                                    }
                                } catch (e) {
                                    console.error("Canvas rendering fallback:", e);
                                    // Fallback to drawing the actual error to see what failed!
                                    const text = new fabric.Textbox("ERROR: " + e.message + "\n\n" + e.stack, {
                                        left: 20,
                                        top: 20,
                                        width: (img.width * scale) - 40,
                                        fontSize: 14,
                                        fill: 'red',
                                        fontFamily: 'monospace',
                                        textAlign: 'left'
                                    });
                                    fabricCanvas.add(text);
                                }
                                fabricCanvas.renderAll();
                            }
                        });
                    }, 100);
                } else {
                    imageContainer.style.display = 'none';
                    document.getElementById('editModal').style.display = "block";
                }
            }
        }

        function downloadCanvas(format) {
            if (!fabricCanvas) return;

            const id = document.getElementById('editAdvtId').value;
            const advt = advts.find(a => a._id === id);

            // Unselect objects so selection boxes don't appear in the exported image
            fabricCanvas.discardActiveObject();
            fabricCanvas.renderAll();

            let exportOptions = { format: 'png', quality: 1 };
            let mainBorder = fabricCanvas.getObjects().find(o => o.id === 'mainBorder');
            
            let exportWidth = fabricCanvas.width;
            let exportHeight = fabricCanvas.height;
            
            if (mainBorder) {
                exportHeight = mainBorder.top + (mainBorder.height * mainBorder.scaleY) + 4;
                exportOptions.height = exportHeight;
            }

            const dataURL = fabricCanvas.toDataURL(exportOptions);

            if (format === 'png') {
                const link = document.createElement('a');
                link.download = 'advertisement.png';
                link.href = dataURL;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else if (format === 'pdf') {
                const { jsPDF } = window.jspdf;

                let pdfUnit = 'px';
                let pdfWidth = exportWidth;
                let pdfHeight = exportHeight;

                if (advt && advt.width > 0) {
                    pdfUnit = (advt.unit || 'cm').toLowerCase();
                    pdfWidth = parseFloat(advt.width);

                    if (advt.height > 0) {
                        if (mainBorder) {
                            let ratio = exportHeight / fabricCanvas.height;
                            pdfHeight = parseFloat(advt.height) * ratio;
                        } else {
                            pdfHeight = parseFloat(advt.height);
                        }
                    } else {
                        pdfHeight = (exportHeight / exportWidth) * pdfWidth;
                    }
                }

                const pdf = new jsPDF({
                    orientation: pdfWidth > pdfHeight ? 'l' : 'p',
                    unit: pdfUnit,
                    format: [pdfWidth, pdfHeight]
                });

                pdf.addImage(dataURL, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save('advertisement.pdf');
            }
        }

        function setupCanvasEvents() {
            fabricCanvas.on('selection:created', handleSelection);
            fabricCanvas.on('selection:updated', handleSelection);
            fabricCanvas.on('text:selection:changed', handleSelection);
            fabricCanvas.on('selection:cleared', function () {
                const tb = document.getElementById('canvasToolbar');
                if (tb) {
                    tb.style.opacity = '0.5';
                    tb.style.pointerEvents = 'none';
                }
            });
            fabricCanvas.on('object:scaling', function(e) {
                if (e.target && e.target.id === 'mainBorder') {
                    const border = e.target;
                    const newHeight = border.height * border.scaleY;
                    const centerLine = fabricCanvas.getObjects().find(o => o.id === 'centerLine');
                    if (centerLine) {
                        centerLine.set({ y2: border.top + newHeight });
                        fabricCanvas.renderAll();
                    }
                }
            });
        }

        function handleSelection(e) {
            const obj = fabricCanvas.getActiveObject();
            if (!obj || obj.type !== 'textbox') return;
            const tb = document.getElementById('canvasToolbar');
            if (tb) {
                tb.style.opacity = '1';
                tb.style.pointerEvents = 'auto';

                let currentFontSize = obj.fontSize;
                let currentFontWeight = obj.fontWeight;

                if (obj.isEditing && obj.selectionStart !== obj.selectionEnd) {
                    const styles = obj.getSelectionStyles() || [];
                    if (styles.length > 0) {
                        if (styles[0].fontSize) currentFontSize = styles[0].fontSize;
                        if (styles[0].fontWeight) currentFontWeight = styles[0].fontWeight;
                    }
                }

                document.getElementById('tbFontSize').value = Math.round(currentFontSize);

                const btnBold = document.getElementById('tbBold');
                if (currentFontWeight === 'bold' || currentFontWeight === '900') {
                    btnBold.classList.add('bg-slate-200', 'border-slate-400');
                } else {
                    btnBold.classList.remove('bg-slate-200', 'border-slate-400');
                }
            }
        }

        function updateSelectedText(property, value) {
            if (!fabricCanvas) return;
            const obj = fabricCanvas.getActiveObject();
            if (!obj || obj.type !== 'textbox') return;

            if (property === 'fontSize' && obj.isEditing && obj.selectionStart !== obj.selectionEnd) {
                obj.setSelectionStyles({ fontSize: parseInt(value, 10) });
            } else {
                if (property === 'fontSize') {
                    obj.set('fontSize', parseInt(value, 10));
                } else if (property === 'textAlign') {
                    obj.set('textAlign', value);
                }
            }
            fabricCanvas.renderAll();
        }

        function toggleBold() {
            if (!fabricCanvas) return;
            const obj = fabricCanvas.getActiveObject();
            if (!obj || obj.type !== 'textbox') return;

            const btnBold = document.getElementById('tbBold');

            if (obj.isEditing && obj.selectionStart !== obj.selectionEnd) {
                const styles = obj.getSelectionStyles() || [];
                let isBold = false;
                if (styles.length > 0 && (styles[0].fontWeight === 'bold' || styles[0].fontWeight === '900')) {
                    isBold = true;
                }

                obj.setSelectionStyles({ fontWeight: isBold ? 'normal' : 'bold' });

                if (!isBold) {
                    btnBold.classList.add('bg-slate-200', 'border-slate-400');
                } else {
                    btnBold.classList.remove('bg-slate-200', 'border-slate-400');
                }
            } else {
                const isBold = obj.fontWeight === 'bold' || obj.fontWeight === '900';
                obj.set('fontWeight', isBold ? 'normal' : 'bold');

                if (!isBold) {
                    btnBold.classList.add('bg-slate-200', 'border-slate-400');
                } else {
                    btnBold.classList.remove('bg-slate-200', 'border-slate-400');
                }
            }

            fabricCanvas.renderAll();
        }

        function updateCanvasFromText() {
            const id = document.getElementById('editAdvtId').value;
            const advtIndex = advts.findIndex(a => a._id === id);
            if (advtIndex !== -1) {
                // Gather data from dynamic blocks and rebuild JSON
                const container = document.getElementById('editBlocksContainer');
                const inputs = container.querySelectorAll('.block-editor-input');
                let newJsonStr = advts[advtIndex].translated_text; // Default to existing
                
                try {
                    let parsedData = JSON.parse(advts[advtIndex].translated_text);
                    let isWrapped = false;
                    let blocks = [];
                    if (Array.isArray(parsedData)) {
                        blocks = parsedData;
                    } else if (parsedData && Array.isArray(parsedData.gujarati_text)) {
                        blocks = parsedData.gujarati_text;
                        isWrapped = true;
                    }
                    
                    if (inputs.length === blocks.length) {
                        inputs.forEach((ta, idx) => {
                            blocks[idx].text = ta.value;
                        });
                        let newJson = isWrapped ? { gujarati_text: blocks } : blocks;
                        newJsonStr = JSON.stringify(newJson);
                    } else if (inputs.length === 1) {
                        newJsonStr = inputs[0].value;
                    }
                } catch(e) {
                    if (inputs.length === 1) {
                        newJsonStr = inputs[0].value;
                    }
                }
                
                // Update hidden textarea and local data
                document.getElementById('editTranslationText').value = newJsonStr;
                advts[advtIndex].translated_text = newJsonStr;
                
                // Preserve scroll position of the modal
                const modal = document.getElementById('editModal');
                const scrollTop = modal.scrollTop;
                
                // Re-open modal to trigger redraw (this will also re-render blocks with new data)
                openEditModal(id);
                
                // Restore scroll after modal is fully re-initialized
                setTimeout(() => {
                    modal.scrollTop = scrollTop;
                }, 100);
            }
        }

        async function saveTranslation() {
            const id = document.getElementById('editAdvtId').value;
            
            // Gather latest text from dynamic blocks before saving
            const container = document.getElementById('editBlocksContainer');
            const inputs = container.querySelectorAll('.block-editor-input');
            let textToSave = document.getElementById('editTranslationText').value;
            
            try {
                let parsedData = JSON.parse(textToSave);
                let isWrapped = false;
                let blocks = [];
                if (Array.isArray(parsedData)) {
                    blocks = parsedData;
                } else if (parsedData && Array.isArray(parsedData.gujarati_text)) {
                    blocks = parsedData.gujarati_text;
                    isWrapped = true;
                }
                
                if (inputs.length === blocks.length) {
                    inputs.forEach((ta, idx) => {
                        blocks[idx].text = ta.value;
                    });
                    let newJson = isWrapped ? { gujarati_text: blocks } : blocks;
                    textToSave = JSON.stringify(newJson);
                } else if (inputs.length === 1) {
                    textToSave = inputs[0].value;
                }
            } catch(e) {
                if (inputs.length === 1) {
                    textToSave = inputs[0].value;
                }
            }

            try {
                const response = await fetch(`/api/advt/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ translated_text: textToSave })
                });

                if (response.ok) {
                    closeEditModal();
                    loadAdvts();
                } else {
                    alert("Failed to save.");
                }
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        async function deleteAdvt(id) {
            if (confirm("Are you sure you want to delete this advertisement?")) {
                try {
                    const response = await fetch(`/api/advt/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        loadAdvts();
                    }
                } catch (e) {
                    alert("Error: " + e.message);
                }
            }
        }

        function toggleDimensions() {
            const unitContainer = document.getElementById('unitContainer');
            const heightContainer = document.getElementById('heightContainer');
            const widthContainer = document.getElementById('widthContainer');
            const heightInput = document.getElementById('advtHeight');
            const widthInput = document.getElementById('advtWidth');

            unitContainer.classList.remove('hidden');
            heightContainer.classList.remove('hidden');
            widthContainer.classList.remove('hidden');
            heightInput.removeAttribute('required');
            widthInput.removeAttribute('required');
        }

        // Modals logic
        function openUploadModal() {
            document.getElementById('uploadModal').style.display = "block";
            toggleDimensions();
        }
        function closeUploadModal() { document.getElementById('uploadModal').style.display = "none"; }
        function closeEditModal() { document.getElementById('editModal').style.display = "none"; }

        window.onclick = function (event) {
            if (event.target == document.getElementById('uploadModal')) closeUploadModal();
            if (event.target == document.getElementById('editModal')) closeEditModal();
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadAdvts();
            loadCategories();
            toggleDimensions();
        });
    </script>
</body>
